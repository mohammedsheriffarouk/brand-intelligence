<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Intelligence — Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
<style>
:root{--ink:#14110F;--muted:#6B645C;--line:#E6E0D8;--paper:#FBF8F4;--accent:#C2410C}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 "IBM Plex Sans Arabic",Inter,system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar b{font-size:18px;margin-left:auto}
select,input,button{font:inherit;font-size:13px;border-radius:8px;border:1px solid #3F3A35;padding:7px 10px;background:#24201C;color:#fff}
button{background:var(--accent);border-color:var(--accent);font-weight:600;cursor:pointer}
#doc{max-width:900px;margin:0 auto;padding:24px 16px 60px;background:var(--paper)}
h1{font-family:Fraunces,Georgia,serif;font-size:32px;margin:0 0 4px}.meta{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;break-inside:avoid;display:flex;flex-direction:column}
.card img{width:100%;height:150px;object-fit:cover;background:#EFE9E1}
.ph{height:150px;background:linear-gradient(135deg,#F3EEE7,#E6DCCF);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;color:#A8A29E;font-size:28px}
.c{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column}
.t{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.tag{font-size:11px;background:#F3EEE7;color:var(--muted);border-radius:99px;padding:2px 8px}
.High{background:#FEE2E2;color:#B91C1C;font-weight:600}.Worth{background:#FEF3C7;color:#B45309;font-weight:600}
h3{font-family:Fraunces,Georgia,serif;font-size:17px;line-height:1.3;margin:2px 0 6px}h3 a{color:inherit;text-decoration:none}
.s{font-size:13.5px;color:#44403C}.src{font-size:12px;color:var(--muted);margin:auto 0 0;padding-top:8px}
.src a{color:var(--accent);font-weight:600;word-break:break-all;direction:ltr;unicode-bidi:embed}
.en{font:12.5px/1.4 Inter,sans-serif;color:var(--muted);direction:ltr;text-align:left;margin:-2px 0 6px}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media print{.bar{display:none}#doc{max-width:none}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="bar">
  <b>Brand Intelligence</b>
  <select id="days"><option value="1">النهارده</option><option value="7" selected>آخر 7 أيام</option><option value="30">آخر 30 يوم</option></select>
  <select id="sec"><option value="">كل الأقسام</option></select>
  <select id="prio"><option value="">كل الأولويات</option><option value="High Priority">أولوية عالية</option><option value="Worth Following">يستحق المتابعة</option><option value="Research Only">للبحث فقط</option></select>
  <select id="geo"><option value="">كل المناطق</option><option value="Egypt">مصر</option><option value="Saudi Arabia">السعودية</option><option value="UAE">الإمارات</option><option value="Oman">عُمان</option><option value="GCC">الخليج</option><option value="Middle East">الشرق الأوسط</option></select>
  <input id="q" placeholder="بحث…" size="12">
  <button onclick="window.print()">PDF</button><button id="png">PNG</button>
</div>
<div id="doc"><h1 id="title">Brand Intelligence</h1><div class="meta" id="meta">Loading…</div><div class="grid" id="grid"></div></div>
<script>
const API = window.BI_API || "";          // Apps Script web-app URL (reads your Google Sheet)
const FALLBACK = "data/news.json";        // published copy of the database (used if API not set / unreachable)
let ALL = [];
const PRI = {"High Priority":"أولوية عالية","Worth Following":"يستحق المتابعة","Research Only":"للبحث فقط"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list = v => { if (Array.isArray(v)) return v; try { const j = JSON.parse(v); return Array.isArray(j) ? j : [v]; } catch { return String(v||"").split(" | ").filter(Boolean); } };
async function load(){
  const days = $("days").value;
  let items = null, from = "";
  if (API) { try { const r = await fetch(API + "?days=" + days); const j = await r.json(); if (j.ok) { items = j.items; from = "Google Sheet (مباشر)"; } } catch(e) {} }
  if (!items) { try { const r = await fetch(FALLBACK); items = await r.json(); from = "نسخة منشورة من الداتابيز";
      const since = new Date(Date.now() - days*864e5).toISOString(); items = items.filter(i => i.collected_at >= since && !i.duplicate_of); } catch(e) { items = []; from = "مفيش مصدر بيانات متاح"; } }
  ALL = items.filter(i => i.priority !== "Reject").sort((a,b) => (+b.overall_score) - (+a.overall_score));
  const secs = [...new Set(ALL.map(i => i.main_category))].filter(Boolean);
  $("sec").innerHTML = '<option value="">كل الأقسام</option>' + secs.map(s => `<option>${esc(s)}</option>`).join("");
  $("meta").dataset.from = from; render();
}
function render(){
  const s = $("sec").value, p = $("prio").value, g = $("geo").value, q = $("q").value.toLowerCase();
  const rows = ALL.filter(i => (!s || i.main_category === s) && (!p || i.priority === p) && (!g || list(i.geography).includes(g))
      && (!q || (i.headline + " " + i.short_summary + " " + i.source_name).toLowerCase().includes(q)));
  $("title").textContent = "Brand Intelligence · " + $("days").selectedOptions[0].text;
  $("meta").textContent = `${rows.length} خبر · المصدر: ${$("meta").dataset.from} · ${new Date().toLocaleString("ar-EG")}`;
  $("grid").innerHTML = rows.length ? rows.map(i => `<article class="card">
    ${i.image_url ? `<img src="${esc(i.image_url)}" crossorigin="anonymous" loading="lazy" onerror="this.outerHTML='<div class=ph>${esc((i.source_name||'?')[0])}</div>'">` : `<div class="ph">${esc((i.source_name||"?")[0])}</div>`}
    <div class="c"><div class="t"><span class="tag ${esc((i.priority||'').split(' ')[0])}">${esc(PRI[i.priority]||i.priority)} · ${esc(i.overall_score)}</span><span class="tag">${esc(String(i.news_type).split(" — ")[1]||i.news_type)}</span>${list(i.geography).slice(0,2).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>
    <h3><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.headline_ar || i.headline)}</a></h3>${i.headline_ar ? `<div class="en">${esc(i.headline)}</div>` : ""}
    <div class="s">${esc(i.summary_ar || (String(i.short_summary||"").startsWith("No summary") ? "المصدر مانشرش ملخص. افتح الخبر الأصلي." : i.short_summary))}</div>
    <div class="src">${esc(i.source_name)} · ${esc(String(i.published_at||"").slice(0,10) || "date n/a")}<br><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.url).slice(0,70)}</a></div></div></article>`).join("")
    : '<div class="empty">مافيش أخبار بالفلاتر دي.</div>';
}
$("png").onclick = async () => { const c = await html2canvas($("doc"), {useCORS:true, scale:2, backgroundColor:"#FBF8F4"});
  const a = document.createElement("a"); a.download = "Brand_Intelligence_" + new Date().toISOString().slice(0,10) + ".png"; a.href = c.toDataURL("image/png"); a.click(); };
["days"].forEach(id => $(id).onchange = load); ["sec","prio","geo"].forEach(id => $(id).onchange = render); $("q").oninput = render;
load();
</script>
</body></html>
