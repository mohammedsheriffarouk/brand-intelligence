# Reusable job: runs one pipeline command, commits data back (history = backups), publishes Reports/ to GitHub Pages.
name: run-pipeline
on:
  workflow_call:
    inputs:
      command: {required: true, type: string}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: brand-intelligence, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: {name: github-pages}
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
      SHEETS_SECRET: ${{ secrets.SHEETS_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}   # latest commit, so chained jobs see each other's data
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Install Chromium for PDF/PNG export
        run: python -m playwright install --with-deps chromium
      - name: Run ${{ inputs.command }}
        run: python run.py ${{ inputs.command }}
      - name: Commit data, reports and logs
        if: always()
        run: |
          git config user.name "brand-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A Database Reports Logs
          git diff --cached --quiet || git commit -m "data: ${{ inputs.command }} $(date -u +%F)"
          git push || (git pull --rebase && git push)
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with: {path: Reports}
      - uses: actions/deploy-pages@v4
        if: always()
