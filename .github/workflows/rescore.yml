name: Re-score all articles + resync Sheet (manual)
on:
  workflow_dispatch:
    inputs:
      resend: {description: "Re-send today's brief (email + Telegram)", type: boolean, default: false}
permissions: {contents: write, pages: write, id-token: write}
jobs:
  rescore:
    uses: ./.github/workflows/_run.yml
    with: {command: "rescore${{ inputs.resend && ' --resend' || '' }}"}
    secrets: inherit
