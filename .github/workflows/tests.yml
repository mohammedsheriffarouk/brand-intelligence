name: Tests
on: {push: {paths: ["engine/**", "tests/**", "Configuration/**"]}, workflow_dispatch: {}}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest && python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests
